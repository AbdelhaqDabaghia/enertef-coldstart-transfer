name: guards

# Every test in tests/ corresponds to a defect that reached production and
# stayed there. They need no GPU, no database and no credentials, so they run
# on every push. If one of these goes red, something that was true yesterday
# is not true today.
#
# What they protect:
#   causality        the rolling means must not contain y_t
#   serving parity   training and serving must compute the same features
#   feature mode     a model must refuse to serve features it was not fitted on
#   settlement       the KPI must be settled against measurement, not re-solved
#   promotion gate   a candidate that persistence beats is not deployable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        # Deliberately minimal: none of the guards need TensorFlow, so they
        # stay fast and do not break when the training stack moves.
        run: python -m pip install --quiet numpy pandas scipy scikit-learn

      - name: run guards
        env:
          # The deployed builder lives in a PRIVATE repository, so CI cannot
          # load it: checking it out would need a token in a public workflow,
          # and vendoring it would publish production code. Instead
          # tests/fixtures/serving_parity.json records what that builder
          # produced -- numbers only -- and the parity claim is checked against
          # it here on every push. The two checks that need the live builder
          # skip, and say so.
          #
          # This proves OUR side has not drifted. Proving THEIR side has not
          # requires a developer run with PROD_BUILDER set, which regenerates
          # from the live builder and fails on any behavioural change. Both
          # halves are needed; neither is sufficient alone.
          PROD_BUILDER: ""
        run: python tests/run_all.py
